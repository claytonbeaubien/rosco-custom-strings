name = "rosco-scale-lookup"
main = "index.js"
compatibility_date = "2025-04-01"

# Keep the workers.dev URL (rosco-scale-lookup.clayton-18a.workers.dev) live for
# the POST endpoints the tool calls. Adding a `routes` block makes wrangler
# disable workers.dev by default, so we re-enable it explicitly.
workers_dev = true

# Custom route for the public re-order short link on a dedicated proxied
# subdomain: go.roscoguitars.com/r/<JOB#> -> 302 to the tool. A subdomain keeps
# the apex (the GHL site) untouched. Needs a Proxied (orange-cloud) DNS record
# for `go` in Cloudflare; the worker handles /r/* so the record's target is
# never actually used. (The apex route couldn't fire because roscoguitars.com is
# DNS-only / grey-cloud for the GHL site, so traffic skips the Cloudflare edge.)
routes = [
  { pattern = "go.roscoguitars.com/r/*", zone_name = "roscoguitars.com" },
]
