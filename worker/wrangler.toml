name = "rosco-scale-lookup"
main = "index.js"
compatibility_date = "2025-04-01"

# The workers.dev URL (rosco-scale-lookup.clayton-18a.workers.dev) stays live for
# the POST endpoints the tool calls. This custom route adds the public re-order
# short link on the main domain: roscoguitars.com/r/<JOB#> -> 302 to the tool.
# The rest of roscoguitars.com (the GHL site) is unaffected - only /r/* matches.
routes = [
  { pattern = "roscoguitars.com/r/*", zone_name = "roscoguitars.com" },
]
